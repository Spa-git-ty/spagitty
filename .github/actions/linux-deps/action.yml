#
# Tauri 2's Linux system dependencies. Needed by every job that compiles the
# `gitlord` crate — which includes the test and lint gates, not just the build,
# because the crate links against webkit2gtk to compile at all.

name: Linux build dependencies
description: Install the webkit2gtk and libsoup packages Tauri 2 needs on Linux

runs:
  using: composite
  steps:
    - name: Install
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev
