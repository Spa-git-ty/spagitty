# SPDX-License-Identifier: GPL-3.0-or-later
#
# The `dev` pre-release, triggered by hand.
#
# Amendment 15: merges into `dev` run gates 1 to 4 and stop. Producing a build
# and an alpha release from `dev` is an explicit action someone takes when they
# want a pre-release — never something a landing does on its own.
#
# The version carries a pre-release suffix (`vX.Y.Z-alpha.N`), so nothing built
# here can be mistaken for a release of `main`.

name: prerelease

on:
  workflow_dispatch:
    inputs:
      alpha:
        description: The alpha number, e.g. 3 for v0.1.0-alpha.3
        required: true
        type: string

concurrency:
  group: prerelease
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.os }}
    if: github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/linux-deps
        if: matrix.os == 'ubuntu-latest'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: spagitty-alpha-${{ matrix.os }}
          path: |
            target/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: warn

  publish:
    name: publish the alpha
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose the pre-release version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          echo "tag=v$base-alpha.${{ inputs.alpha }}" >> "$GITHUB_OUTPUT"

      - name: Refuse to move an existing tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.tag }} already exists; pick the next alpha number"
            exit 1
          fi

      # An alpha's notes are the changelog's Unreleased section — that is what
      # an alpha is a preview of (Amendment 20). Empty Unreleased, no alpha.
      - name: Read the notes out of the changelog
        run: |
          node tools/release-notes.mjs Unreleased > notes.md
          cat notes.md

      # The runner has no git identity; an annotated tag needs one.
      - name: Tag and publish as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Spagitty ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Spagitty ${{ steps.version.outputs.tag }}" \
            --prerelease \
            --notes-file notes.md \
            $(find artifacts -type f | tr '\n' ' ')
