[workspace]
resolver = "2"
members = ["crates/gitlumiere-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
repository = "https://github.com/gitlumiere/gitlumiere"
authors = ["GitLumiere contributors"]

[workspace.dependencies]
gitlumiere-core = { path = "crates/gitlumiere-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
