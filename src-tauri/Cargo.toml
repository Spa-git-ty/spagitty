# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "spagitty"
description = "A cross-platform desktop Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "spagitty"

[lib]
name = "spagitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The build script reads `cargo metadata` and `package-lock.json` to generate
# the dependency license list. Already a runtime dependency; no new tool.
serde_json = { workspace = true }

[dependencies]
spagitty-core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
notify = "8"
