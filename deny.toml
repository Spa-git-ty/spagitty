# SPDX-License-Identifier: GPL-3.0-or-later
#
# Gate 1 of the pipeline: every Rust dependency's license is identified and
# permitted, and nothing in the tree conflicts with GitLumiere shipping under
# GPL-3.0-or-later. See docs/ci.md.

[graph]
all-features = false

[licenses]
# Permissive licenses only. Each of these can be combined into a GPL-3 work;
# a copyleft dependency under a different copyleft would need a decision, not
# a default, so none is listed here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # GitLumiere's own crates.
    "GPL-3.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of the same crate is a smell, not a failure — the Tauri tree
# carries a few. Worth seeing in the log without stopping the pipeline.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# Gate 4 runs the same file with `cargo deny check advisories`.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
